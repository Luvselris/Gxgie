<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard 💙 Gxgie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --blue-deep: #1e40af;
      --blue-main: #3b82f6;
      --blue-soft: #eff6ff;
      --blue-border: #dbeafe;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.97);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--blue-soft) 55%, #e0f2fe 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 14px 70px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 500px; }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 26px rgba(59, 130, 246, 0.14);
      border: 1.5px solid #ffffff;
      margin-bottom: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: var(--blue-deep);
      text-align: center;
      margin-bottom: 14px;
    }

    .field-group { margin-bottom: 12px; }
    .field-label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
      color: var(--text-dark);
    }

    .input-box, .textarea-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--blue-border);
      outline: none;
      font-size: 13.5px;
      background: #ffffff;
      color: var(--text-dark);
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--blue-main); }
    .textarea-box { min-height: 85px; resize: vertical; }

    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      white-space: nowrap;
      padding: 10px 12px;
      border: 1.5px solid var(--blue-border);
      border-radius: 16px;
      background: #ffffff;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--blue-main), var(--blue-deep));
      color: #ffffff;
      border-color: transparent;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--blue-main), var(--blue-deep));
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.98); }

    .btn-secondary {
      background: #ffffff;
      color: var(--blue-deep);
      border: 1.5px solid var(--blue-border);
      box-shadow: none;
    }

    .btn-danger-sm {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* การ์ดจัดการ Highlight */
    .hl-admin-card {
      background: #f8fafc;
      border: 1.5px solid var(--blue-border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .hl-admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .hl-thumb-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .hl-thumb-item {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--blue-border);
      background: #ffffff;
    }
    .hl-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hl-thumb-del {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* การ์ดจัดการรีวิว */
    .rev-admin-item {
      background: #ffffff;
      border: 1.5px solid var(--blue-border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">

  <!-- กล่องเข้าสู่ระบบ -->
  <div class="card" id="loginBox">
    <div class="title">Admin Dashboard 💙 Gxgie</div>
    <div class="field-group">
      <label class="field-label">อีเมลแอดมิน (Email)</label>
      <input type="email" id="loginEmail" class="input-box" placeholder="minasukikub@gmail.com">
    </div>
    <div class="field-group">
      <label class="field-label">รหัสผ่าน (Password)</label>
      <input type="password" id="loginPass" class="input-box" placeholder="••••••••">
    </div>
    <button type="button" class="btn" onclick="handleAdminLogin()">เข้าสู่ระบบแอดมิน 💙</button>
  </div>

  <!-- แผงควบคุมแอดมิน -->
  <div id="dashboardBox" class="hidden">
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('general', this)">1. ข้อมูลร้าน 💙</button>
      <button type="button" class="tab-btn" onclick="switchTab('highlights', this)">2. ไฮไลท์ (ไม่จำกัดรูป) 💙</button>
      <button type="button" class="tab-btn" onclick="switchTab('reviews', this)">3. จัดการรีวิว 💙</button>
      <button type="button" class="tab-btn" onclick="switchTab('account', this)">4. บัญชี 💙</button>
    </div>

    <!-- แท็บ 1: ข้อมูลร้าน -->
    <div class="tab-content active" id="tab-general">
      <div class="card">
        <div class="title">แก้ไขโปรไฟล์หน้าร้าน 💙</div>
        <div class="field-group">
          <label class="field-label">ชื่อร้าน</label>
          <input type="text" id="cfgShopName" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายไบโอ (Bio)</label>
          <textarea id="cfgShopBio" class="textarea-box"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์รูปแบนเนอร์ (Banner URL)</label>
          <input type="text" id="cfgBanner" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์รูปโปรไฟล์ (Profile URL)</label>
          <input type="text" id="cfgProfile" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์เพลงพื้นหลัง (.mp3)</label>
          <input type="text" id="cfgMusic" class="input-box">
        </div>
        <button type="button" class="btn" onclick="saveGeneralConfig()">บันทึกข้อมูลร้านค้า 💙</button>
      </div>
    </div>

    <!-- แท็บ 2: จัดการ Highlights -->
    <div class="tab-content" id="tab-highlights">
      <div class="card">
        <div class="title">เพิ่มหมวดหมู่ไฮไลท์ใหม่ 💙</div>
        <div class="field-group">
          <label class="field-label">ชื่อไฮไลท์ (เช่น รีวิว, สติกเกอร์, เครดิต)</label>
          <input type="text" id="newHlTitle" class="input-box" placeholder="ตั้งชื่อไฮไลท์...">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์รูปปกไฮไลท์ (Cover URL)</label>
          <input type="text" id="newHlCover" class="input-box" placeholder="https://...">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์รูปภาพด้านใน (ใส่ได้ไม่จำกัด ขึ้นบรรทัดใหม่เพื่อใส่หลายรูป)</label>
          <textarea id="newHlImages" class="textarea-box" placeholder="วางลิงก์รูปภาพต้นฉบับที่นี่ (1 บรรทัด = 1 รูป ใส่กี่ร้อยรูปก็ได้ค่ะ)"></textarea>
        </div>
        <button type="button" class="btn" onclick="createNewHighlight()">+ สร้างไฮไลท์นี้ 💙</button>
      </div>

      <div class="card">
        <div class="title">รายการไฮไลท์ทั้งหมด (เพิ่ม / ลบรูปได้ไม่จำกัด) 💙</div>
        <p style="font-size:12px; color:var(--text-muted); text-align:center; margin-bottom:12px;">
          * รูปภาพจะใช้ลิงก์ต้นฉบับความคมชัด 100% โดยไม่มีการลดขนาดหรือบีบอัดไฟล์
        </p>
        <div id="adminHighlightsList">
          <p style="text-align:center; font-size:13px; color:var(--text-muted);">กำลังโหลดข้อมูลไฮไลท์...</p>
        </div>
      </div>
    </div>

    <!-- แท็บ 3: จัดการรีวิว -->
    <div class="tab-content" id="tab-reviews">
      <div class="card">
        <div class="title">จัดการรีวิวลูกค้าทั้งหมด 💙</div>
        <div id="adminReviewsList">
          <p style="text-align:center; font-size:13px; color:var(--text-muted);">กำลังโหลดรีวิว...</p>
        </div>
      </div>
    </div>

    <!-- แท็บ 4: บัญชีแอดมิน -->
    <div class="tab-content" id="tab-account">
      <div class="card">
        <div class="title">ตั้งค่าบัญชีเข้าสู่ระบบ 💙</div>
        <div class="field-group">
          <label class="field-label">อีเมลแอดมิน</label>
          <input type="email" id="editAdminEmail" class="input-box">
        </div>
        <div class="field-group">
          <label class="field-label">รหัสผ่านใหม่ (ปล่อยว่างหากไม่ต้องการเปลี่ยน)</label>
          <input type="password" id="editAdminPass" class="input-box" placeholder="รหัสผ่านใหม่">
        </div>
        <button type="button" class="btn" onclick="updateAdminAccount()">บันทึกข้อมูลบัญชี 💙</button>
        <button type="button" class="btn btn-secondary" onclick="logoutAdmin()">ออกจากระบบ 💙</button>
      </div>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCkcPDpXEX4Hopb8d7qJu1UypTKXEC0rqw",
    authDomain: "butterbear-d2afd.firebaseapp.com",
    projectId: "butterbear-d2afd",
    storageBucket: "butterbear-d2afd.firebasestorage.app",
    messagingSenderId: "721696079994",
    appId: "1:721696079994:web:e1cf38eb821aae3561bbc3",
    measurementId: "G-GBTV8DVBR3"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DB_SITE = "gxgie_site";
  const DB_REVIEWS = "gxgie_reviews";
  const DB_HIGHLIGHTS = "gxgie_highlights";

  // ข้อมูลเริ่มต้นตามที่กำหนด
  let currentAdminEmail = "minasukikub@gmail.com";
  let currentAdminPass = "creditgxgie00469";

  // ซิงค์ข้อมูลรหัสผ่านหากมีการแก้ไขใน Firestore
  db.collection(DB_SITE).doc("admin").onSnapshot(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.email) currentAdminEmail = d.email;
      if (d.pass) currentAdminPass = d.pass;
    }
  });

  function handleAdminLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass = document.getElementById('loginPass').value.trim();

    if (email === currentAdminEmail.toLowerCase() && pass === currentAdminPass) {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('dashboardBox').classList.remove('hidden');
      initAdminDashboard();
    } else {
      alert('อีเมลหรือรหัสผ่านแอดมินไม่ถูกต้องค่ะ 💙');
    }
  }

  function switchTab(tabName, btnEl) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btnEl.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  function initAdminDashboard() {
    // โหลดข้อมูลร้าน
    db.collection(DB_SITE).doc("config").get().then(doc => {
      const d = doc.exists ? doc.data() : {};
      document.getElementById('cfgShopName').value = d.shopName || "Gxgie";
      document.getElementById('cfgShopBio').value = d.shopBio || "Credit, plus one here \nthanks for your support \nline : @632wdjwj";
      document.getElementById('cfgBanner').value = d.bannerImg || "https://file.garden/asG8Gt-rqWIpi3II/IMG_7602.png";
      document.getElementById('cfgProfile').value = d.profileImg || "https://file.garden/asG8Gt-rqWIpi3II/IMG_7602.png";
      document.getElementById('cfgMusic').value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/Cocktail%20%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B9%80%E0%B8%95%E0%B9%89%E0%B8%99%E0%B8%A3%E0%B8%B3%E0%B9%83%E0%B8%99%E0%B8%84%E0%B8%B7%E0%B8%99%E0%B8%9E%E0%B8%A3%E0%B8%B0%E0%B8%88%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B9%8C%E0%B9%80%E0%B8%95%E0%B9%87%E0%B8%A1%E0%B8%94%E0%B8%A7%E0%B8%87.mp3";
    });

    document.getElementById('editAdminEmail').value = currentAdminEmail;

    listenHighlightsAdmin();
    listenReviewsAdmin();
  }

  async function saveGeneralConfig() {
    const payload = {
      shopName: document.getElementById('cfgShopName').value.trim(),
      shopBio: document.getElementById('cfgShopBio').value.trim(),
      bannerImg: document.getElementById('cfgBanner').value.trim(),
      profileImg: document.getElementById('cfgProfile').value.trim(),
      musicUrl: document.getElementById('cfgMusic').value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await db.collection(DB_SITE).doc("config").set(payload, { merge: true });
    alert('บันทึกข้อมูลโปรไฟล์ร้านค้าเรียบร้อยแล้วค่ะ 💙');
  }

  // สร้างไฮไลท์ใหม่พร้อมบันทึกรูปแยกทีละเอกสารใน subcollection 'images' (รองรับไม่จำกัดจำนวน)
  async function createNewHighlight() {
    const title = document.getElementById('newHlTitle').value.trim();
    const coverInput = document.getElementById('newHlCover').value.trim();
    const rawUrls = document.getElementById('newHlImages').value
      .split(/\r?\n/)
      .map(u => u.trim())
      .filter(u => u.length > 0);

    if (!title) return alert('กรุณาตั้งชื่อไฮไลท์ก่อนนะคะ 💙');
    if (rawUrls.length === 0 && !coverInput) {
      return alert('กรุณาใส่ลิงก์รูปภาพอย่างน้อย 1 รูปค่ะ 💙');
    }

    const coverUrl = coverInput || rawUrls[0];

    try {
      const hlRef = await db.collection(DB_HIGHLIGHTS).add({
        title: title,
        cover: coverUrl,
        order: Date.now(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // บันทึกรูปภาพทีละรายการลง subcollection (ไม่ติดขีดจำกัดขนาดเอกสาร 1MB)
      for (let i = 0; i < rawUrls.length; i++) {
        await hlRef.collection("images").add({
          url: rawUrls[i],
          createdAt: Date.now() + i
        });
      }

      document.getElementById('newHlTitle').value = '';
      document.getElementById('newHlCover').value = '';
      document.getElementById('newHlImages').value = '';
      alert(`สร้างไฮไลท์ "${title}" พร้อมรูปภาพ ${rawUrls.length} รูปเรียบร้อยแล้วค่ะ 💙`);
      renderHighlightsAdminList();
    } catch (err) {
      alert('เกิดข้อผิดพลาดในการสร้างไฮไลท์: ' + err.message);
    }
  }

  function listenHighlightsAdmin() {
    db.collection(DB_HIGHLIGHTS).orderBy("order", "asc").onSnapshot(() => {
      renderHighlightsAdminList();
    });
  }

  async function renderHighlightsAdminList() {
    const container = document.getElementById('adminHighlightsList');
    const snap = await db.collection(DB_HIGHLIGHTS).orderBy("order", "asc").get();

    if (snap.empty) {
      container.innerHTML = '<p style="text-align:center; font-size:13px; color:var(--text-muted); padding:14px;">ยังไม่มีไฮไลท์ในระบบ สามารถเพิ่มด้านบนได้เลยค่ะ 💙</p>';
      return;
    }

    container.innerHTML = '';

    for (const doc of snap.docs) {
      const hl = doc.data();
      const hlId = doc.id;

      const imgSnap = await db.collection(DB_HIGHLIGHTS).doc(hlId).collection("images").orderBy("createdAt", "asc").get();
      let thumbsHtml = '';
      imgSnap.forEach(imgDoc => {
        const imgData = imgDoc.data();
        thumbsHtml += `
          <div class="hl-thumb-item">
            <img src="${imgData.url}" alt="img">
            <button type="button" class="hl-thumb-del" title="ลบรูปนี้" onclick="deleteSingleHighlightImage('${hlId}', '${imgDoc.id}')">✕</button>
          </div>
        `;
      });

      const card = document.createElement('div');
      card.className = 'hl-admin-card';
      card.innerHTML = `
        <div class="hl-admin-header">
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${hl.cover}" style="width:42px; height:42px; border-radius:50%; object-fit:cover; border:2px solid var(--blue-main);">
            <div>
              <div style="font-weight:700; font-size:14.5px; color:var(--blue-deep);">${escapeHtml(hl.title)}</div>
              <div style="font-size:11.5px; color:var(--text-muted);">จำนวนรูปด้านใน: <strong>${imgSnap.size}</strong> รูป (ความชัด 100%)</div>
            </div>
          </div>
          <button type="button" class="btn-danger-sm" onclick="deleteEntireHighlight('${hlId}', '${escapeHtml(hl.title)}')">ลบไฮไลท์นี้</button>
        </div>

        <div style="margin-top:8px;">
          <textarea id="add-imgs-${hlId}" class="textarea-box" style="min-height:62px; font-size:12.5px;" placeholder="วางลิงก์รูปภาพเพิ่มในไฮไลท์นี้ (ใส่ได้ไม่จำกัด ขึ้นบรรทัดใหม่เพื่อใส่หลายรูป)"></textarea>
          <button type="button" class="btn btn-secondary" style="padding:8px; font-size:12.5px; margin-top:6px;" onclick="appendImagesToHighlight('${hlId}')">+ เพิ่มรูปเข้าไฮไลท์นี้ 💙</button>
        </div>

        <div class="hl-thumb-grid">
          ${thumbsHtml}
        </div>
      `;
      container.appendChild(card);
    }
  }

  async function appendImagesToHighlight(hlId) {
    const box = document.getElementById(`add-imgs-${hlId}`);
    if (!box) return;
    const urls = box.value.split(/\r?\n/).map(u => u.trim()).filter(u => u.length > 0);
    if (urls.length === 0) return alert('กรุณาวางลิงก์รูปภาพก่อนกดเพิ่มนะคะ 💙');

    for (let i = 0; i < urls.length; i++) {
      await db.collection(DB_HIGHLIGHTS).doc(hlId).collection("images").add({
        url: urls[i],
        createdAt: Date.now() + i
      });
    }

    box.value = '';
    alert(`เพิ่มรูปภาพอีก ${urls.length} รูปเรียบร้อยแล้วค่ะ 💙`);
    renderHighlightsAdminList();
  }

  async function deleteSingleHighlightImage(hlId, imgId) {
    if (!confirm('ต้องการลบรูปภาพนี้ออกจากไฮไลท์ใช่ไหมคะ? 💙')) return;
    await db.collection(DB_HIGHLIGHTS).doc(hlId).collection("images").doc(imgId).delete();
    renderHighlightsAdminList();
  }

  async function deleteEntireHighlight(hlId, title) {
    if (!confirm(`ต้องการลบไฮไลท์ "${title}" และรูปภาพทั้งหมดในหมวดนี้ใช่ไหมคะ? 💙`)) return;

    // ลบรูปย่อยทั้งหมดก่อน
    const imgSnap = await db.collection(DB_HIGHLIGHTS).doc(hlId).collection("images").get();
    const batch = db.batch();
    imgSnap.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection(DB_HIGHLIGHTS).doc(hlId));
    await batch.commit();

    alert(`ลบไฮไลท์ "${title}" เรียบร้อยแล้วค่ะ 💙`);
    renderHighlightsAdminList();
  }

  // จัดการรีวิว
  function listenReviewsAdmin() {
    db.collection(DB_REVIEWS).orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById('adminReviewsList');
      if (snap.empty) {
        box.innerHTML = '<p style="text-align:center; font-size:13px; color:var(--text-muted); padding:14px;">ยังไม่มีรีวิวในระบบค่ะ 💙</p>';
        return;
      }

      let html = '';
      snap.forEach(doc => {
        const d = doc.data();
        const stars = '★'.repeat(d.rating || 5);
        html += `
          <div class="rev-admin-item">
            <div style="flex:1;">
              <div style="font-weight:700; font-size:13.5px; color:var(--blue-deep);">
                ${escapeHtml(d.name)} <span style="color:#f59e0b; font-size:12px;">${stars}</span>
                <span style="font-size:11px; color:var(--text-muted); font-weight:400;">(${escapeHtml(d.shortDate || '')})</span>
              </div>
              <div style="font-size:12.5px; color:var(--text-dark); margin-top:4px; white-space:pre-line;">${escapeHtml(d.text)}</div>
            </div>
            <button type="button" class="btn-danger-sm" onclick="deleteReview('${doc.id}')">ลบ</button>
          </div>
        `;
      });
      box.innerHTML = html;
    });
  }

  async function deleteReview(revId) {
    if (!confirm('ต้องการลบรีวิวนี้ใช่ไหมคะ? 💙')) return;
    await db.collection(DB_REVIEWS).doc(revId).delete();
  }

  async function updateAdminAccount() {
    const newEmail = document.getElementById('editAdminEmail').value.trim();
    const newPass = document.getElementById('editAdminPass').value.trim();
    const payload = {};
    if (newEmail) { payload.email = newEmail; currentAdminEmail = newEmail; }
    if (newPass) { payload.pass = newPass; currentAdminPass = newPass; }

    await db.collection(DB_SITE).doc("admin").set(payload, { merge: true });
    document.getElementById('editAdminPass').value = '';
    alert('อัปเดตข้อมูลบัญชีแอดมินเรียบร้อยแล้วค่ะ 💙');
  }

  function logoutAdmin() {
    document.getElementById('dashboardBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
    document.getElementById('loginPass').value = '';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
